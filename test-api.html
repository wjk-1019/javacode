<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 连接测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>多模态检索系统 - API 连接测试</h1>
    
    <div class="info status">
        <strong>后端地址:</strong> <span id="apiUrl">http://localhost:8000</span>
    </div>

    <div>
        <button onclick="testHealth()">测试后端健康状态</button>
        <button onclick="testSystemInfo()">获取系统信息</button>
    </div>

    <div id="result"></div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        async function testHealth() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="info status">正在测试...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success status">
                            <h3>✓ 后端连接成功！</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    throw new Error('请求失败');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error status">
                        <h3>✗ 连接失败</h3>
                        <p>错误信息: ${error.message}</p>
                        <p>请确保后端服务已启动在 ${API_BASE_URL}</p>
                        <p>启动命令: <code>python api_server.py</code></p>
                    </div>
                `;
            }
        }

        async function testSystemInfo() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="info status">正在获取系统信息...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/system/info`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success status">
                            <h3>✓ 系统信息</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    throw new Error('请求失败');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="error status">
                        <h3>✗ 获取失败</h3>
                        <p>错误信息: ${error.message}</p>
                        <p>请确保后端服务已启动在 ${API_BASE_URL}</p>
                    </div>
                `;
            }
        }

        // 页面加载时自动测试连接
        window.onload = function() {
            testHealth();
        };
    </script>
</body>
</html>
